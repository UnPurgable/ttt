<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tic Tac Toe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=DM+Mono:wght@400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body.theme-void {
–bg: #0a0a0a;
–panel: #161616;
–panel2: #1e1e1e;
–x: #ff4d4d;
–o: #4ddfff;
–grid: #2a2a2a;
–text: #e8e8e8;
–muted: #555;
–win: #ffd700;
–shadow: rgba(0,0,0,0.6);
}

body.theme-arctic {
–bg: #dff0fb;
–panel: #ffffff;
–panel2: #eaf5ff;
–x: #1a6bbf;
–o: #0099cc;
–grid: #aaced8;
–text: #0d2340;
–muted: #7a9ec0;
–win: #e6a817;
–shadow: rgba(0,60,120,0.12);
}

body.theme-parchment {
–bg: #f0e6d0;
–panel: #fdf6ec;
–panel2: #ede0c8;
–x: #8b3a1a;
–o: #4a6e2a;
–grid: #c8a87a;
–text: #2e1a0e;
–muted: #9a7a5a;
–win: #c8860a;
–shadow: rgba(80,40,0,0.15);
}

body {
background-color: var(–bg);
color: var(–text);
font-family: ‘DM Mono’, monospace;
min-height: 100dvh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 24px 20px;
gap: 18px;
overflow-x: hidden;
transition: background-color 0.35s, color 0.35s;
}

/* void background pattern */
body.theme-void { background-image: radial-gradient(circle at 20% 20%, #1a1a1a 0%, #0a0a0a 60%); }
body.theme-arctic { background-image: linear-gradient(160deg, #eaf6ff 0%, #cce8f8 100%); }
body.theme-parchment { background-image: linear-gradient(160deg, #f5ede0 0%, #e8d5b8 100%); }

h1 {
font-family: ‘Black Han Sans’, sans-serif;
font-size: clamp(1.8rem, 7vw, 2.8rem);
letter-spacing: 0.14em;
text-transform: uppercase;
color: var(–text);
}

/* ── THEME SWITCHER ── */
.theme-switcher {
display: flex;
gap: 10px;
align-items: center;
background: var(–panel);
border: 2px solid var(–grid);
border-radius: 50px;
padding: 6px 14px;
box-shadow: 0 2px 12px var(–shadow);
}

.theme-label {
font-size: 0.58rem;
letter-spacing: 0.2em;
text-transform: uppercase;
color: var(–muted);
padding-right: 6px;
border-right: 1px solid var(–grid);
}

.theme-btn {
width: 36px;
height: 36px;
border-radius: 50%;
border: 3px solid transparent;
cursor: pointer;
transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
-webkit-tap-highlight-color: transparent;
padding: 0;
display: flex;
align-items: center;
justify-content: center;
font-size: 1.1rem;
position: relative;
overflow: hidden;
}

.theme-btn:active { transform: scale(0.85); }

.theme-btn.active {
border-color: var(–text);
box-shadow: 0 0 0 2px var(–bg), 0 0 0 4px var(–text);
transform: scale(1.1);
}

.void-btn {
background: conic-gradient(#1a1a1a, #333, #111, #444, #1a1a1a);
}

.arctic-btn {
background: conic-gradient(#a8d4f5, #c8eaff, #7bbfe8, #d8f0ff, #a8d4f5);
}

.parchment-btn {
background: conic-gradient(#d4b896, #e8d0b0, #c0966a, #f0dfc0, #d4b896);
}

.theme-btn .dot {
width: 10px;
height: 10px;
border-radius: 50%;
background: rgba(255,255,255,0.5);
position: absolute;
top: 6px;
left: 6px;
}

/* ── SCOREBOARD ── */
.scoreboard {
display: flex;
gap: 10px;
width: 100%;
max-width: 360px;
}

.score-card {
flex: 1;
background: var(–panel);
border-radius: 16px;
padding: 14px 8px;
text-align: center;
border: 2px solid var(–grid);
box-shadow: 0 2px 10px var(–shadow);
transition: border-color 0.25s, box-shadow 0.25s, background 0.35s;
}

.score-card.active-x { border-color: var(–x); box-shadow: 0 0 20px color-mix(in srgb, var(–x) 35%, transparent); }
.score-card.active-o { border-color: var(–o); box-shadow: 0 0 20px color-mix(in srgb, var(–o) 35%, transparent); }

.score-card .label {
font-size: 0.58rem;
letter-spacing: 0.15em;
text-transform: uppercase;
color: var(–muted);
margin-bottom: 4px;
}

.score-card .player {
font-family: ‘Black Han Sans’, sans-serif;
font-size: 1.6rem;
letter-spacing: 0.08em;
}

.score-card.x-card .player { color: var(–x); }
.score-card.o-card .player { color: var(–o); }
.score-card.draw-card .player { color: var(–muted); }

.score-card .count {
font-size: 2.2rem;
font-weight: 500;
margin-top: 2px;
color: var(–text);
}

/* ── TURN ── */
.turn {
font-size: 0.78rem;
letter-spacing: 0.2em;
text-transform: uppercase;
color: var(–muted);
height: 22px;
}

.turn .tx { color: var(–x); font-weight: 500; }
.turn .to { color: var(–o); font-weight: 500; }

/* ── GRID ── */
.grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 10px;
width: 100%;
max-width: 340px;
}

.cell {
aspect-ratio: 1;
background: var(–panel);
border-radius: 18px;
border: 2px solid var(–grid);
display: flex;
align-items: center;
justify-content: center;
font-family: ‘Black Han Sans’, sans-serif;
font-size: clamp(2rem, 12vw, 3.5rem);
cursor: pointer;
box-shadow: 0 2px 8px var(–shadow);
transition: background 0.15s, border-color 0.15s, transform 0.1s, box-shadow 0.15s;
-webkit-tap-highlight-color: transparent;
user-select: none;
}

.cell:active { transform: scale(0.91); }
.cell.empty:hover { background: var(–panel2); }
.cell.x { color: var(–x); border-color: color-mix(in srgb, var(–x) 50%, transparent); }
.cell.o { color: var(–o); border-color: color-mix(in srgb, var(–o) 50%, transparent); }
.cell.win-cell {
background: color-mix(in srgb, var(–win) 12%, var(–panel));
border-color: var(–win);
box-shadow: 0 0 18px color-mix(in srgb, var(–win) 40%, transparent);
}

/* ── STATUS ── */
.status {
font-size: 0.88rem;
letter-spacing: 0.18em;
text-transform: uppercase;
min-height: 22px;
text-align: center;
color: var(–text);
}

.status.win { color: var(–win); font-weight: 500; }
.status.draw { color: var(–muted); }

/* ── BUTTONS ── */
.btn-row { display: flex; gap: 10px; }

button {
padding: 13px 26px;
border-radius: 50px;
border: 2px solid var(–grid);
background: var(–panel);
color: var(–text);
font-family: ‘DM Mono’, monospace;
font-size: 0.75rem;
letter-spacing: 0.15em;
text-transform: uppercase;
cursor: pointer;
box-shadow: 0 2px 8px var(–shadow);
transition: background 0.15s, border-color 0.15s, transform 0.1s;
-webkit-tap-highlight-color: transparent;
}

button:active { transform: scale(0.95); }
button.primary { border-color: var(–x); background: color-mix(in srgb, var(–x) 12%, var(–panel)); color: var(–x); }
button.secondary { border-color: var(–muted); color: var(–muted); }

@keyframes pop {
0% { transform: scale(1); }
50% { transform: scale(1.16); }
100% { transform: scale(1); }
}
.popped { animation: pop 0.3s ease; }
</style>

</head>
<body class="theme-void">

<h1>Tic Tac Toe</h1>

<div class="theme-switcher">
  <span class="theme-label">Theme</span>
  <button class="theme-btn void-btn active" data-theme="void" title="Void">
    <span class="dot"></span>
  </button>
  <button class="theme-btn arctic-btn" data-theme="arctic" title="Arctic">
    <span class="dot"></span>
  </button>
  <button class="theme-btn parchment-btn" data-theme="parchment" title="Parchment">
    <span class="dot"></span>
  </button>
</div>

<div class="scoreboard">
  <div class="score-card x-card" id="cardX">
    <div class="label">Player</div>
    <div class="player">X</div>
    <div class="count" id="scoreX">0</div>
  </div>
  <div class="score-card draw-card" id="cardD">
    <div class="label">Draws</div>
    <div class="player" style="color:var(--muted)">—</div>
    <div class="count" id="scoreD">0</div>
  </div>
  <div class="score-card o-card" id="cardO">
    <div class="label">Player</div>
    <div class="player">O</div>
    <div class="count" id="scoreO">0</div>
  </div>
</div>

<div class="turn" id="turn">Turn: <span class="tx">X</span></div>

<div class="grid">
  <div class="cell empty" data-i="0"></div>
  <div class="cell empty" data-i="1"></div>
  <div class="cell empty" data-i="2"></div>
  <div class="cell empty" data-i="3"></div>
  <div class="cell empty" data-i="4"></div>
  <div class="cell empty" data-i="5"></div>
  <div class="cell empty" data-i="6"></div>
  <div class="cell empty" data-i="7"></div>
  <div class="cell empty" data-i="8"></div>
</div>

<div class="status" id="status"></div>

<div class="btn-row">
  <button class="primary" id="btnNext">New Round</button>
  <button class="secondary" id="btnReset">Reset Scores</button>
</div>

<script>
  // THEME
  const themeBtns = document.querySelectorAll('.theme-btn');
  applyTheme(localStorage.getItem('ttt-theme') || 'void');

  themeBtns.forEach(btn => btn.addEventListener('click', () => applyTheme(btn.dataset.theme)));

  function applyTheme(t) {
    document.body.className = 'theme-' + t;
    themeBtns.forEach(b => b.classList.toggle('active', b.dataset.theme === t));
    localStorage.setItem('ttt-theme', t);
  }

  // GAME
  const cells = document.querySelectorAll('.cell');
  const turnEl = document.getElementById('turn');
  const statusEl = document.getElementById('status');
  const scoreX = document.getElementById('scoreX');
  const scoreO = document.getElementById('scoreO');
  const scoreD = document.getElementById('scoreD');
  const cardX = document.getElementById('cardX');
  const cardO = document.getElementById('cardO');

  const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let board = Array(9).fill('');
  let current = 'X';
  let gameOver = false;
  let scores = { X: 0, O: 0, D: 0 };

  function setTurn(p) {
    current = p;
    if (!gameOver) {
      turnEl.innerHTML = `Turn: <span class="t${p.toLowerCase()}">${p}</span>`;
      cardX.className = 'score-card x-card' + (p === 'X' ? ' active-x' : '');
      cardO.className = 'score-card o-card' + (p === 'O' ? ' active-o' : '');
    }
  }

  function checkWin() {
    for (const [a,b,c] of WINS)
      if (board[a] && board[a] === board[b] && board[a] === board[c]) return [a,b,c];
    return null;
  }

  cells.forEach(cell => {
    cell.addEventListener('click', () => {
      const i = +cell.dataset.i;
      if (gameOver || board[i]) return;
      board[i] = current;
      cell.textContent = current;
      cell.classList.remove('empty');
      cell.classList.add(current.toLowerCase());

      const win = checkWin();
      if (win) {
        gameOver = true;
        win.forEach(idx => cells[idx].classList.add('win-cell', 'popped'));
        statusEl.textContent = `Player ${current} wins! 🎉`;
        statusEl.className = 'status win';
        turnEl.textContent = '';
        scores[current]++;
        scoreX.textContent = scores.X;
        scoreO.textContent = scores.O;
        animateScore(current === 'X' ? scoreX : scoreO);
      } else if (!board.includes('')) {
        gameOver = true;
        statusEl.textContent = "It's a draw!";
        statusEl.className = 'status draw';
        turnEl.textContent = '';
        scores.D++;
        scoreD.textContent = scores.D;
        animateScore(scoreD);
      } else {
        setTurn(current === 'X' ? 'O' : 'X');
      }
    });
  });

  function animateScore(el) {
    el.classList.remove('popped');
    void el.offsetWidth;
    el.classList.add('popped');
  }

  function newRound() {
    board = Array(9).fill('');
    gameOver = false;
    cells.forEach(c => { c.textContent = ''; c.className = 'cell empty'; });
    statusEl.textContent = '';
    statusEl.className = 'status';
    setTurn('X');
  }

  function resetAll() {
    scores = { X: 0, O: 0, D: 0 };
    scoreX.textContent = '0';
    scoreO.textContent = '0';
    scoreD.textContent = '0';
    newRound();
  }

  document.getElementById('btnNext').addEventListener('click', newRound);
  document.getElementById('btnReset').addEventListener('click', resetAll);

  setTurn('X');
</script>

</body>
</html>
